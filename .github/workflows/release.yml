name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Pack
        run: pnpm pack --pack-destination dist

      # The market's tarball URL uses a version-free asset name:
      # releases/latest/download/dsh-finesse-visualizer.tgz
      - name: Give the asset its stable name
        run: cp dist/dsh-finesse-visualizer-*.tgz dist/dsh-finesse-visualizer.tgz

      - name: Create the GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/dsh-finesse-visualizer.tgz --generate-notes --title "${GITHUB_REF_NAME}"
